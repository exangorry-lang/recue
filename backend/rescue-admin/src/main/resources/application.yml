server:
  port: 8080

spring:
  application:
    name: rescue-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

# 自定义配置
shrescue:
  jwt:
    # 密钥长度需 >= 32 字节（HS256）
    secret: ${JWT_SECRET}
    # 过期时间（秒），默认 24 小时
    expire-seconds: 86400
  cors:
    # Comma-separated allowed origins, for example https://training.example.com
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  bootstrap:
    # Used only once for legacy __CHANGE_ME_BCRYPT__ records in the seed data.
    initial-password: ${INITIAL_USER_PASSWORD}

logging:
  level:
    com.shrescue: info
