server:
  port: 8080

spring:
  application:
    name: rescue-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rescue_training?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 自定义配置
shrescue:
  jwt:
    # 密钥长度需 >= 32 字节（HS256）
    secret: shrescue-jwt-secret-key-2026-shanghai-rescue-base-training-system-0123456789
    # 过期时间（秒），默认 24 小时
    expire-seconds: 86400

logging:
  level:
    com.shrescue: info
